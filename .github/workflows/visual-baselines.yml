name: Update Linux visual baselines

# Re-records the *-linux.png toHaveScreenshot baselines on the same runner as
# "Playwright commerce flows". Download the artifact, review every image, then
# commit the ones that look right into the matching *.spec.ts-snapshots folder.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: Spec file to re-record
        default: tests/e2e/mockup-repair-visual.spec.ts
        required: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_COMMERCE_V2_ENABLED: "false"
  COMMERCE_PERSISTENCE_ENABLED: "false"
  COMMERCE_CHECKOUT_ENABLED: "false"
  PRINTIFY_FULFILLMENT_MODE: disabled

jobs:
  update:
    name: Record Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record baselines
        run: npx playwright test "$SPEC" --update-snapshots
        env:
          SPEC: ${{ inputs.spec }}

      - name: Upload baselines for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: tests/e2e/**/*-linux.png
          retention-days: 14
